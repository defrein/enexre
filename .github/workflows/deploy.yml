name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-enexre
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, enexre]
    steps:
      - name: Pull latest master and restart service
        run: sudo /usr/local/sbin/deploy-enexre.sh